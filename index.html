<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101d2b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
  <title>Coastline Orange Hotel | Reception Display</title>
  <style>
    :root {
      --accent: #ff982e;
      --accent-soft: rgba(255, 152, 46, .22);
      --mint: #64e0b2;
      --sky: #44bef4;
      --glass: rgba(8, 16, 27, .55);
      --line: rgba(255, 255, 255, .13);
      --muted: rgba(255, 255, 255, .72);
      --white: #fff;
      --radius: clamp(16px, 1.5vw, 30px);
      --ticker-h: clamp(66px, 8.8vh, 98px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      color: var(--white);
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      /* Varsayılan (gündüz) arka plan */
      background:
        radial-gradient(ellipse at 14% 12%, rgba(47, 166, 220, .68), transparent 33%),
        radial-gradient(ellipse at 89% 82%, rgba(255, 157, 54, .29), transparent 32%),
        linear-gradient(120deg, #174e70 0%, #173a5b 43%, #182a43 72%, #263954 100%);
    }

    /* Tema katmanları: gradyan geçişi animasyonlanamadığı için katmanların opacity'si geçirilir (ucuz) */
    .theme-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 5s ease; }
    .night-layer {
      background:
        radial-gradient(ellipse at 12% 8%, rgba(42, 83, 125, .4), transparent 35%),
        radial-gradient(ellipse at 88% 90%, rgba(255, 133, 42, .12), transparent 30%),
        linear-gradient(125deg, #101d2e 0%, #09121f 56%, #202b43 100%);
    }
    .sunset-layer {
      background:
        radial-gradient(ellipse at 16% 104%, rgba(255, 112, 40, .55), transparent 58%),
        radial-gradient(ellipse at 88% -6%, rgba(196, 72, 124, .38), transparent 52%),
        linear-gradient(120deg, rgba(255, 146, 52, .14), rgba(118, 52, 112, .24));
    }
    body.theme-night .night-layer { opacity: 1; }
    body.theme-sunset .sunset-layer { opacity: 1; }

    .dashboard {
      position: relative; z-index: 1;
      width: 100%; height: 100%;
      padding: clamp(9px, 1.1vw, 23px);
      display: grid;
      grid-template-rows: minmax(92px, 13.8vh) minmax(0, 1fr) minmax(100px, 14vh);
      gap: clamp(9px, 1vw, 20px);
    }
    /* backdrop-filter kaldırıldı: zayıf TV ekran kartlarında en pahalı efektti */
    .glass-panel {
      min-width: 0;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 34px rgba(0,0,0,.15);
    }

    /* Header */
    .header {
      display: grid;
      grid-template-columns: minmax(205px, .95fr) minmax(280px, 1.25fr) minmax(560px, 2.5fr);
      align-items: stretch;
      gap: clamp(12px, 1.15vw, 24px);
      padding: 12px clamp(18px, 1.6vw, 34px);
      min-height: 112px;
      overflow: visible;
    }
    .logo-wrap { display: flex; align-items: center; justify-content: flex-start; min-width: 0; height: 100%; overflow: hidden; }
    .hotel-logo { display: block; flex: 0 1 auto; width: clamp(125px, 13vw, 230px); height: 100%; max-height: 100%; object-fit: contain; object-position: left center; }
    .welcome-area { min-width: 0; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(3px, .45vw, 8px); padding: 4px 0; }
    .date-display { font-size: clamp(13px, 1vw, 19px); line-height: 1.3; font-weight: 650; opacity: .8; letter-spacing: clamp(1px, .15vw, 2.8px); text-transform: uppercase; white-space: normal; }
    .welcome-text { font-size: clamp(20px, 1.75vw, 34px); line-height: 1.2; font-weight: 850; letter-spacing: clamp(1px, .16vw, 3px); text-shadow: 0 3px 16px rgba(0,0,0,.35); white-space: nowrap; transition: opacity .4s ease, transform .4s ease; }
    .lang-dots { display: flex; gap: clamp(10px, 1vw, 18px); font-size: clamp(10px, .75vw, 14px); font-weight: 800; letter-spacing: 1.5px; }
    .lang-dot { color: rgba(255,255,255,.34); padding-bottom: 2px; border-bottom: 2px solid transparent; transition: color .4s ease, border-color .4s ease; }
    .lang-dot.active { color: var(--accent); border-bottom-color: var(--accent); }
    .clocks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(7px, .65vw, 13px); min-width: 0; min-height: 78px; height: 100%; align-items: stretch; }
    .clock-card { border-radius: clamp(13px, 1vw, 22px); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.19); border: 1px solid rgba(255,255,255,.10); min-width: 0; min-height: 78px; padding: 8px 4px; }
    .clock-city { font-size: clamp(11px, .85vw, 16px); line-height: 1.25; opacity: .8; letter-spacing: clamp(.5px, .11vw, 2px); font-weight: 750; white-space: nowrap; }
    .clock-time { font-variant-numeric: tabular-nums; font-size: clamp(21px, 2.05vw, 40px); line-height: 1.12; font-weight: 800; letter-spacing: -1px; margin-top: 5px; white-space: nowrap; }

    /* Main slideshow */
    .main-panel { position: relative; min-height: 0; overflow: hidden; isolation: isolate; }
    .main-panel::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1; background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.045), transparent 55%); }
    .slider { position: absolute; inset: 0; }
    .slide {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: clamp(14px, 1.8vw, 36px) clamp(16px, 2.5vw, 50px) calc(var(--ticker-h) + 34px);
      opacity: 0; visibility: hidden; transform: translateY(12px) scale(.995);
      transition: opacity .75s ease, transform .75s ease, visibility 0s linear .75s;
      pointer-events: none;
    }
    .slide.active { opacity: 1; visibility: visible; transform: translateY(0) scale(1); transition-delay: 0s; pointer-events: auto; }

    /* Yemek / içecek slaytı */
    .menu-slide { display: flex; flex-direction: row; gap: clamp(12px, 2vw, 40px); }
    .menu-column { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 clamp(8px, 1.3vw, 26px); }
    .menu-column + .menu-column { border-left: 1px solid rgba(255,255,255,.16); }
    .food-photo-wrap { width: min(100%, 410px); height: clamp(145px, 29vh, 315px); position: relative; overflow: hidden; border-radius: clamp(16px, 1.4vw, 28px); border: 1px solid rgba(255,255,255,.19); box-shadow: 0 15px 34px rgba(0,0,0,.28); margin-bottom: clamp(12px, 1.5vh, 20px); background: linear-gradient(135deg, rgba(255,152,46,.12), rgba(255,255,255,.04)); }
    .food-photo { display: block; width: 100%; height: 100%; object-fit: cover; }
    .photo-placeholder { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; color: rgba(255,255,255,.6); font-size: clamp(40px, 5vw, 90px); }
    .menu-column h1 { text-align: center; font-size: clamp(21px, 2.25vw, 44px); line-height: 1.1; font-weight: 900; letter-spacing: clamp(.5px, .12vw, 2px); text-shadow: 0 5px 16px rgba(0,0,0,.3); margin-bottom: 12px; }
    .price-tag { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; padding: 8px 22px; border-radius: 100px; color: var(--accent); background: rgba(0,0,0,.35); border: 1px solid var(--accent-soft); font-size: clamp(17px, 1.35vw, 27px); font-weight: 850; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .price-tag::after { content: ""; position: absolute; inset: 0; transform: translateX(-130%); background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.38) 50%, transparent 70%); pointer-events: none; }

    /* Yön farkı (içecek soldan, yemek sağdan) + kademeli giriş + fiyat parlaması */
    .slide.active .col-left  { animation: fromLeft .85s cubic-bezier(.2,.7,.2,1) both; }
    .slide.active .col-right { animation: fromRight .85s cubic-bezier(.2,.7,.2,1) both; }
    .slide.active .menu-column h1 { animation: rise .6s ease both .35s; }
    .slide.active .price-tag { animation: rise .6s ease both .55s; }
    .slide.active .price-tag::after { animation: shine 1.2s ease 1.2s 1 forwards; }
    @keyframes fromLeft  { from { opacity: 0; transform: translateX(-6vw); } to { opacity: 1; transform: none; } }
    @keyframes fromRight { from { opacity: 0; transform: translateX(6vw); }  to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes shine { to { transform: translateX(130%); } }

    /* Ken Burns çeşitliliği: yakınlaş / uzaklaş / sola kay / sağa kay */
    .slide.active .food-photo, .slide.leaving .food-photo { will-change: transform; }
    .slide.active .kb-in,    .slide.leaving .kb-in    { animation: kbIn 10s ease-out both; }
    .slide.active .kb-out,   .slide.leaving .kb-out   { animation: kbOut 10s ease-out both; }
    .slide.active .kb-left,  .slide.leaving .kb-left  { animation: kbLeft 10s linear both; }
    .slide.active .kb-right, .slide.leaving .kb-right { animation: kbRight 10s linear both; }
    @keyframes kbIn    { from { transform: scale(1); } to { transform: scale(1.07); } }
    @keyframes kbOut   { from { transform: scale(1.08); } to { transform: scale(1); } }
    @keyframes kbLeft  { from { transform: translateX(1.6%) scale(1.07); } to { transform: translateX(-1.6%) scale(1.07); } }
    @keyframes kbRight { from { transform: translateX(-1.6%) scale(1.07); } to { transform: translateX(1.6%) scale(1.07); } }

    /* Otel bilgi slaytı */
    .info-slide-inner { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 1.5vw, 30px); width: 100%; height: 100%; max-height: 100%; align-items: stretch; }
    .info-block { min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(8px, 1.15vh, 15px); background: rgba(2,8,17,.24); border: 1px solid rgba(255,255,255,.09); border-radius: clamp(18px, 1.8vw, 34px); padding: clamp(14px, 2vw, 38px) clamp(10px, 1.25vw, 24px); box-shadow: 0 12px 28px rgba(0,0,0,.15); }
    .info-icon { font-size: clamp(37px, 4vw, 74px); line-height: 1; filter: drop-shadow(0 5px 12px rgba(0,0,0,.2)); }
    .info-accent { width: clamp(40px, 4vw, 78px); height: 3px; border-radius: 10px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
    .info-title { font-size: clamp(16px, 1.7vw, 33px); font-weight: 900; letter-spacing: clamp(.4px, .1vw, 2px); }
    .info-detail { font-size: clamp(16px, 1.55vw, 30px); font-weight: 800; color: var(--mint); overflow-wrap: anywhere; }
    .info-sub { font-size: clamp(13px, 1.1vw, 21px); line-height: 1.4; color: var(--muted); max-width: 28ch; }

    /* QR slaytları (dokunmatik değil: link yok, QR büyük) */
    .guide-slide-content { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(200px, .9fr); align-items: center; gap: clamp(20px, 4vw, 70px); max-width: 1300px; width: 100%; }
    .guide-copy { padding-left: clamp(8px, 2vw, 35px); }
    .eyebrow { text-transform: uppercase; font-size: clamp(11px, .9vw, 17px); color: var(--accent); font-weight: 850; letter-spacing: 4px; margin-bottom: 15px; }
    .guide-title { font-size: clamp(28px, 3vw, 58px); line-height: 1.08; font-weight: 900; margin-bottom: 18px; }
    .guide-sub { color: var(--muted); font-size: clamp(15px, 1.3vw, 25px); line-height: 1.55; max-width: 36ch; }
    .qr-card { display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; justify-self: center; min-width: 200px; background: rgba(255,255,255,.96); color: #13243a; padding: clamp(14px, 1.4vw, 28px); border-radius: 25px; box-shadow: 0 15px 34px rgba(0,0,0,.25); }
    .qr-code { display: block; width: clamp(150px, min(19vw, 42vh), 360px); height: clamp(150px, min(19vw, 42vh), 360px); object-fit: contain; image-rendering: pixelated; }
    .qr-caption { font-size: clamp(13px, 1vw, 19px); font-weight: 850; text-align: center; letter-spacing: 1px; }

    /* Hava durumu slaytı (3 gün + UV + deniz suyu) */
    .weather-slide-inner { display: flex; flex-direction: column; gap: clamp(10px, 1.8vh, 22px); width: 100%; height: 100%; }
    .forecast-days { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 1.5vw, 28px); }
    .day-card { min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(3px, .8vh, 10px); background: rgba(2,8,17,.24); border: 1px solid rgba(255,255,255,.09); border-radius: clamp(18px, 1.8vw, 34px); padding: clamp(8px, 1.5vh, 22px) clamp(8px, 1vw, 20px); box-shadow: 0 12px 28px rgba(0,0,0,.15); }
    .day-card.today { background: rgba(255,152,46,.09); border-color: var(--accent-soft); }
    .day-name { font-size: clamp(15px, 2.7vh, 30px); font-weight: 900; letter-spacing: 2px; }
    .day-date { font-size: clamp(11px, 1.9vh, 20px); color: var(--muted); }
    .day-icon { width: clamp(56px, 13vh, 130px); height: clamp(56px, 13vh, 130px); display: flex; align-items: center; justify-content: center; }
    .day-temp { display: flex; align-items: baseline; justify-content: center; gap: .4em; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .day-temp .hi { font-size: clamp(24px, 5vh, 54px); font-weight: 900; }
    .day-temp .lo { font-size: clamp(16px, 3vh, 32px); font-weight: 800; color: var(--muted); }
    .day-cond { font-size: clamp(12px, 2.2vh, 24px); font-weight: 800; color: var(--mint); }
    .day-rain { font-size: clamp(11px, 2vh, 22px); color: var(--muted); }
    .forecast-extras { flex: 0 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: clamp(10px, 1.5vw, 28px); }
    .extra-tile { min-width: 0; display: flex; align-items: center; gap: clamp(10px, 1.2vw, 22px); background: rgba(2,8,17,.24); border: 1px solid rgba(255,255,255,.09); border-radius: clamp(16px, 1.5vw, 28px); padding: clamp(8px, 1.5vh, 18px) clamp(12px, 1.3vw, 26px); }
    .extra-icon { font-size: clamp(26px, 5vh, 54px); line-height: 1; flex: 0 0 auto; }
    .extra-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .extra-label { font-size: clamp(10px, 1.7vh, 17px); letter-spacing: 1.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
    .extra-value { font-size: clamp(18px, 3.4vh, 36px); font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .extra-value small { font-size: .58em; font-weight: 850; letter-spacing: 1px; margin-left: .35em; }
    .extra-note { font-size: clamp(11px, 1.8vh, 19px); color: var(--muted); }
    .uv-low { color: var(--mint); } .uv-mid { color: #ffd45e; } .uv-high { color: var(--accent); } .uv-vhigh { color: #ff6f61; }

    /* Dalga çizgisi, noktalar ve alt şerit */
    .wave { position: absolute; z-index: 6; left: 0; right: 0; bottom: calc(var(--ticker-h) - 12px); height: 24px; overflow: hidden; pointer-events: none; }
    .wave svg { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; animation: waveMove 18s linear infinite; }
    .wave svg.w2 { animation-duration: 28s; animation-direction: reverse; }
    .wave-path { fill: none; vector-effect: non-scaling-stroke; stroke-width: 2; stroke-linecap: round; }
    .wp1 { stroke: rgba(68,190,244,.7); }
    .wp2 { stroke: rgba(255,152,46,.55); }
    @keyframes waveMove { to { transform: translateX(-50%); } }
    .slide-dots { position: absolute; z-index: 7; bottom: calc(var(--ticker-h) + 28px); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; max-width: 46%; overflow: hidden; pointer-events: none; }
    .dot { display: block; flex: 0 0 auto; width: 6px; height: 6px; border-radius: 20px; background: rgba(255,255,255,.25); transition: width .35s ease, background .35s ease; }
    .dot.active { width: 20px; background: var(--accent); }
    .dot.info-dot.active { background: var(--mint); }
    .dot.weather-dot.active { background: var(--sky); }

    .ticker { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; height: var(--ticker-h); display: flex; align-items: center; justify-content: center; padding: 6px clamp(10px, 1.6vw, 36px); background: rgba(3,9,17,.5); border-top: 1px solid rgba(255,255,255,.1); }
    .ticker-items { width: 100%; display: flex; justify-content: space-evenly; align-items: center; gap: clamp(8px, 1.2vw, 24px); }
    .ticker-item { display: flex; align-items: center; justify-content: center; gap: clamp(6px, .6vw, 12px); min-width: 0; transition: opacity .6s ease; }
    .ticker-item .emoji { font-size: clamp(20px, 1.8vw, 34px); line-height: 1; }
    .ticker-item .svc { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; white-space: nowrap; }
    .ticker-item .label { font-size: clamp(11px, .85vw, 16px); font-weight: 750; color: rgba(255,255,255,.72); }
    .ticker-item .hours { font-size: clamp(14px, 1.15vw, 22px); font-weight: 850; font-variant-numeric: tabular-nums; }
    .ticker-item .state { font-size: clamp(10px, .75vw, 14px); font-weight: 850; padding: 3px 9px; border-radius: 99px; letter-spacing: .6px; white-space: nowrap; background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); }
    .ticker-item.open .state { background: rgba(100,224,178,.2); color: var(--mint); }
    .ticker-item.closing .state, .ticker-item.soon .state { background: rgba(255,152,46,.22); color: var(--accent); }
    .ticker-item.closed { opacity: .55; }

    /* Aktif olmayan slaytlardaki hava ikonu animasyonları durur */
    .slide:not(.active):not(.leaving) .weather-svg * { animation-play-state: paused; }

    /* Footer */
    .footer { min-height: 0; display: grid; grid-template-columns: minmax(235px, .95fr) minmax(430px, 1.75fr) minmax(275px, 1.05fr); gap: clamp(8px, .9vw, 18px); }
    .footer-card { min-width: 0; border-radius: var(--radius); background: var(--glass); border: 1px solid var(--line); box-shadow: 0 10px 25px rgba(0,0,0,.13); display: flex; align-items: center; justify-content: center; padding: clamp(9px, 1vw, 19px); overflow: hidden; }
    .weather-inner { display: flex; align-items: center; gap: clamp(14px, 1vw, 19px); width: 100%; justify-content: center; min-width: 0; }
    .weather-icon { display: flex; align-items: center; justify-content: center; flex: 0 0 clamp(60px, 5.2vw, 90px); width: clamp(60px, 5.2vw, 90px); height: clamp(60px, 5.2vw, 90px); filter: drop-shadow(0 5px 10px rgba(0,0,0,.18)); }
    .weather-svg { display: block; flex: 0 0 100%; width: 100%; height: 100%; overflow: visible; margin: auto; }
    /* Açık hava ikonunda güneş viewBox'ta sol üstte çizildiği için ortalamak amacıyla kaydırılır */
    .weather-svg.weather-clear { transform: translate(18%, 18%); }
    .weather-svg .sun-rays { transform-origin: 32px 32px; animation: weatherSunSpin 32s linear infinite; }
    .weather-svg .sun-disc { transform-origin: 32px 32px; animation: weatherSunPulse 4s ease-in-out infinite; }
    .weather-svg .moon-shape { animation: weatherMoonGlow 4s ease-in-out infinite; }
    .weather-svg .cloud-shape { transform-origin: 50px 50px; animation: weatherCloudFloat 4.5s ease-in-out infinite; }
    .weather-svg .rain-streaks { animation: weatherRainFall .95s linear infinite; }
    .weather-svg .snow-flakes { animation: weatherSnowFall 2s ease-in-out infinite alternate; }
    .weather-svg .fog-lines { animation: weatherFogDrift 3.5s ease-in-out infinite alternate; }
    .weather-svg .lightning-bolt { animation: weatherLightning 2.5s steps(1, end) infinite; }
    @keyframes weatherSunSpin { to { transform: rotate(360deg); } }
    @keyframes weatherSunPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes weatherMoonGlow { 0%, 100% { opacity: 1; } 50% { opacity: .78; } }
    @keyframes weatherCloudFloat { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(2px); } }
    @keyframes weatherRainFall { 0% { transform: translateY(-2px); opacity: .6; } 100% { transform: translateY(4px); opacity: 1; } }
    @keyframes weatherSnowFall { from { transform: translateY(-1px); } to { transform: translateY(3px); } }
    @keyframes weatherFogDrift { from { transform: translateX(-2px); opacity: .65; } to { transform: translateX(3px); opacity: 1; } }
    @keyframes weatherLightning { 0%, 82%, 100% { opacity: 1; } 84%, 88% { opacity: .45; } }
    .weather-info { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .temp { font-size: clamp(22px, 2vw, 38px); line-height: 1.1; font-weight: 850; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .weather-condition { font-size: clamp(12px, .95vw, 18px); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
    .weather-extra { font-size: clamp(11px, .85vw, 16px); line-height: 1.3; color: rgba(255,255,255,.68); }
    .review-card { padding: 8px clamp(8px, 1.2vw, 24px); }
    .review-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; gap: clamp(6px, 1vw, 18px); width: 100%; height: 100%; }

      items.push({ type: 'weather' });
      items.push({ type: 'guide' });
      items.push({ type: 'menuQr' });

      const slideFrag = document.createDocumentFragment();
      const dotsFrag = document.createDocumentFragment();
      items.forEach((item, index) => {
        const slide = document.createElement('div');

          menu: 'menu-slide', info: 'info-slide', weather: 'weather-slide',
          guide: 'guide-slide qr-slide', menuQr: 'menu-qr-slide qr-slide'

          });

          slide.innerHTML = weatherSlide();
        } else if (item.type === 'guide') {
          slide.innerHTML = qrSlide(tr('guideEyebrow'), tr('guideTitle'), tr('guideSub'), tr('guideQr'), 'Coastline Orange Hotel Google Maps QR code');
          setupQrImage(slide.querySelector('.qr-code'), CONFIG.qrMapFile, CONFIG.mapUrl);
        } else {
          slide.innerHTML = qrSlide(tr('menuEyebrow'), tr('menuTitle'), tr('menuSub'), tr('menuQr'), 'Coastline Orange Hotel digital menu QR code');
          setupQrImage(slide.querySelector('.qr-code'), CONFIG.qrMenuFile, CONFIG.menuUrl);
        }
        slideFrag.appendChild(slide);

        const dot = document.createElement('span');
        dot.className = 'dot' + (index === 0 ? ' active' : '') + (item.type === 'info' ? ' info-dot' : '') + (item.type === 'weather' ? ' weather-dot' : '');
        if (item.type === 'weather') dot.style.display = 'none'; // hava verisi gelince görünür
        dotsFrag.appendChild(dot);
      });
      sliderEl.replaceChildren(slideFrag);
      dotsEl.replaceChildren(dotsFrag);
      slides = Array.from(sliderEl.querySelectorAll('.slide'));
      dots = Array.from(dotsEl.querySelectorAll('.dot'));
    }

    /* ---- Görselleri sadece aktif + sıradaki slaytta yükle (RAM tasarrufu) ---- */
    function loadSlideImages(slide) {
      slide.querySelectorAll('img[data-src]').forEach(img => {
        if (img.getAttribute('src') !== img.dataset.src) {
          const ph = img.nextElementSibling;
          img.style.display = '';
          if (ph) ph.style.display = 'none';
          img.src = img.dataset.src;
        }
      });
    }
    function unloadSlideImages(slide) {
      slide.querySelectorAll('img[data-src]').forEach(img => img.removeAttribute('src'));
    }
    function refreshImages() {
      const next = nextIndex(currentSlide);
      loadSlideImages(slides[currentSlide]);
      loadSlideImages(slides[next]);
      window.clearTimeout(unloadTimer);
      unloadTimer = window.setTimeout(() => {
        slides.forEach((s, i) => { if (i !== currentSlide && i !== next) unloadSlideImages(s); });
      }, 1500);
    }

    /* ---- Slayt geçişi ---- */
    function slideAvailable(slide) { return slide.dataset.kind !== 'weather' || !!latestWeatherPayload; }
    function nextIndex(from) {
      for (let step = 1; step <= slides.length; step++) {
        const i = (from + step) % slides.length;
        if (slideAvailable(slides[i])) return i;
      }
      return from;
    }
    function activateSlide(next) {
      if (!slides.length || next === currentSlide) return;
      const prev = slides[currentSlide];
      prev.classList.remove('active');
      prev.classList.add('leaving');
      dots[currentSlide].classList.remove('active');
      window.setTimeout(() => prev.classList.remove('leaving'), 1000);
      currentSlide = next;
      const cur = slides[currentSlide];
      cur.classList.remove('leaving');
      loadSlideImages(cur);
      cur.classList.add('active');
      dots[currentSlide].classList.add('active');
      refreshImages();
    }
    function scheduleNextSlide() {
      const slide = slides[currentSlide];
      const duration = (slide && CONFIG.durations[slide.dataset.kind]) || CONFIG.durations.menu;
      window.setTimeout(() => {
        activateSlide(nextIndex(currentSlide));
        scheduleNextSlide();
      }, duration);
    }
    function syncDots() {
      slides.forEach((s, i) => {
        if (s.dataset.kind === 'weather') dots[i].style.display = slideAvailable(s) ? '' : 'none';
      });
    }

    /* =====================================================================
       DALGA, DİL NOKTALARI, ALT ŞERİT
       ===================================================================== */
    function buildWave() {
      let d = 'M0 12 Q75 0 150 12';
      for (let i = 2; i <= 16; i++) d += ' T' + (150 * i) + ' 12';
      document.querySelectorAll('.wave-path').forEach(p => p.setAttribute('d', d));
    }

    function buildLangDots() {
      const frag = document.createDocumentFragment();
      LANGUAGES.forEach((l, i) => {
        const s = document.createElement('span');
        s.className = 'lang-dot' + (i === 0 ? ' active' : '');
        s.textContent = l.label;
        frag.appendChild(s);
      });
      $('langDots').replaceChildren(frag);
    }
    function updateLangDots() {
      Array.from($('langDots').children).forEach((el, i) => el.classList.toggle('active', i === currentLanguageIndex));
    }

    function buildTicker() {
      const frag = document.createDocumentFragment();
      SERVICES.forEach(svc => {
        const el = document.createElement('div');
        el.className = 'ticker-item closed';
        const close = svc.close === '24:00' ? '00:00' : svc.close;
        el.innerHTML =
          `<span class="emoji">${svc.emoji}</span>` +
          `<span class="svc"><span class="label">${svc.label}</span><span class="hours">${svc.open}–${close}</span></span>` +
          `<span class="state"></span>`;
        frag.appendChild(el);
        tickerRows.push({ el, badge: el.querySelector('.state'), svc });
      });
      $('tickerItems').replaceChildren(frag);
    }

    function serviceState(s, now) {
      const o = toMin(s.open), c = toMin(s.close);
      if (now >= o && now < c) return c - now <= CONFIG.soonMinutes ? 'closing' : 'open';
      if (now < o) return o - now <= CONFIG.soonMinutes ? 'soon' : 'closed';
      return 'closed';
    }

    function updateTicker() {
      const now = nowMin();
      const words = LANGUAGES[currentLanguageIndex].status;
      tickerRows.forEach(row => {
        const st = serviceState(row.svc, now);
        if (row.el.dataset.state !== st) {
          row.el.className = 'ticker-item ' + st;
          row.el.dataset.state = st;
        }
        setText(row.badge, words[st]);
      });
    }

    /* =====================================================================
       TARİH, SAAT, TEMA, DİL
       ===================================================================== */
    function updateDate() {
      setText($('dateDisplay'), dateFmts[currentLanguageIndex].format(new Date()));
    }

    function updateClocks() {
      const now = new Date();
      clocks.forEach(c => setText(c.el, c.fmt.format(now)));
    }

    function applyTheme() {
      const now = nowMin();
      const { sunrise, sunset } = sunTimes;
      let isDay, isSunset = false;
      if (sunrise !== null && sunset !== null) {
        isDay = now >= sunrise && now < sunset + 30;
        isSunset = now >= sunset - 45 && now < sunset + 30;
      } else {
        isDay = now >= 480 && now < 1200;
      }
      const cl = document.body.classList;
      cl.toggle('theme-day', isDay);
      cl.toggle('theme-night', !isDay);
      cl.toggle('theme-sunset', isSunset);
    }

    // Dakikada bir (dakika başına hizalı) çalışır: saatler, tarih, tema, açık/kapalı durumu
    function tick() {
      window.clearTimeout(tickTimer);
      updateClocks();
      updateDate();
      applyTheme();
      updateTicker();
      tickTimer = window.setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
    }

    function applyLanguage() {
      const lang = LANGUAGES[currentLanguageIndex];
      document.documentElement.lang = lang.code;
      const welcomeEl = $('welcomeText');
      welcomeEl.style.opacity = '0';
      welcomeEl.style.transform = 'translateY(5px)';
      window.setTimeout(() => {
        welcomeEl.textContent = lang.welcome;
        welcomeEl.style.opacity = '1';
        welcomeEl.style.transform = 'translateY(0)';
      }, 180);
      updateDate();
      updateLangDots();
      updateTicker();
    }

    function rotateHeaderLanguage() {
      currentLanguageIndex = (currentLanguageIndex + 1) % LANGUAGES.length;
      applyLanguage();
    }

    /* =====================================================================
       HAVA DURUMU
       ===================================================================== */
    function weatherLabel(code) {
      // Open-Meteo / WMO weather codes
      if (code === 0) return { type: 'clear', key: 'clear' };
      if (code === 1) return { type: 'mainly-clear', key: 'mainlyClear' };
      if (code === 2) return { type: 'partly-cloudy', key: 'partlyCloudy' };
      if (code === 3) return { type: 'cloudy', key: 'cloudy' };
      if ([45, 48].includes(code)) return { type: 'fog', key: 'fog' };
      if ([51, 53, 55].includes(code)) return { type: 'drizzle', key: 'drizzle' };
      if ([56, 57].includes(code)) return { type: 'freezing-drizzle', key: 'freezingDrizzle' };
      if ([61, 63, 65].includes(code)) return { type: 'rain', key: 'rain' };
      if ([66, 67].includes(code)) return { type: 'freezing-rain', key: 'freezingRain' };
      if ([71, 73, 75].includes(code)) return { type: 'snow', key: 'snow' };
      if (code === 77) return { type: 'snow-grains', key: 'snowGrains' };
      if ([80, 81, 82].includes(code)) return { type: 'showers', key: 'showers' };
      if ([85, 86].includes(code)) return { type: 'snow-showers', key: 'snowShowers' };
      if (code === 95) return { type: 'thunderstorm', key: 'thunderstorm' };
      if ([96, 99].includes(code)) return { type: 'hail-storm', key: 'hailStorm' };
      return { type: 'mixed', key: 'mixed' };
    }

    function weatherIconSvg(type, isDay) {
      const sun = `<g class="sun-rays" stroke="#ffc45c" stroke-width="4" stroke-linecap="round"><path d="M32 8v5M32 51v5M8 32h5M51 32h5M15 15l4 4M45 45l4 4M15 49l4-4M45 19l4-4"/></g><circle class="sun-disc" cx="32" cy="32" r="12" fill="#ffc45c" stroke="#ffe6a4" stroke-width="2"/>`;
      const moon = `<g class="moon-shape"><path d="M39 12a22 22 0 1 0 25 32A19 19 0 0 1 39 12Z" fill="#dbeaff" stroke="#f7fbff" stroke-width="1.5"/><g fill="#ffffff"><circle cx="68" cy="20" r="2.2"/><circle cx="77" cy="35" r="1.5"/><path d="M67 43l1.5 3.5L72 48l-3.5 1.5L67 53l-1.5-3.5L62 48l3.5-1.5Z"/></g></g>`;
      const baseCloud = `<path class="cloud-shape" d="M24 65h48a15 15 0 0 0 0-30c-1.7 0-3.3.3-4.8.8A23 23 0 0 0 23 40a13 13 0 0 0 1 25Z" fill="#edf6ff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>`;
      const smallCloud = `<path class="cloud-shape" d="M58 42h20a9 9 0 0 0 0-18c-1 0-2 .1-3 .4A14 14 0 0 0 48 30a8 8 0 0 0 10 12Z" fill="#edf6ff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>`;
      const rain = `<g class="rain-streaks" stroke="#78d8ff" stroke-width="4" stroke-linecap="round"><path d="M31 72l-4 9M48 72l-4 9M65 72l-4 9"/></g>`;
      const drizzle = `<g class="rain-streaks" stroke="#a6e6ff" stroke-width="3" stroke-linecap="round"><path d="M35 73l-2 5M50 73l-2 5M65 73l-2 5"/></g>`;
      const snow = `<g class="snow-flakes" stroke="#b5eaff" stroke-width="2.5" stroke-linecap="round"><path d="M30 76v10M25 81h10M26.5 77.5l7 7M33.5 77.5l-7 7M50 72v10M45 77h10M46.5 73.5l7 7M53.5 73.5l-7 7M69 76v10M64 81h10M65.5 77.5l7 7M72.5 77.5l-7 7"/></g>`;
      const ice = `<g class="snow-flakes" stroke="#9de8ff" stroke-width="2.5" stroke-linecap="round"><path d="M39 73v9M34.5 77.5h9M62 73v9M57.5 77.5h9"/></g>`;
      const fog = `<g class="fog-lines" fill="none" stroke="#c6d8e7" stroke-width="4" stroke-linecap="round"><path d="M17 73h29M52 73h30M22 83h21M49 83h29"/></g>`;
      const bolt = `<path class="lightning-bolt" d="M52 65 39 83h10l-4 13 19-23H53l7-8Z" fill="#ffd15c" stroke="#fff1af" stroke-width="1.4" stroke-linejoin="round"/>`;
      const hail = `<g fill="#bcecff" stroke="#f3fbff" stroke-width="1.3"><circle cx="34" cy="80" r="3.5"/><circle cx="65" cy="82" r="3.5"/></g>`;
      const sky = isDay ? sun : moon;
      let contents = '';
      switch (type) {
        case 'clear': contents = sky; break;
        case 'mainly-clear': contents = sky + smallCloud; break;
        case 'partly-cloudy': contents = sky + baseCloud; break;
        case 'cloudy': contents = baseCloud; break;
        case 'fog': contents = baseCloud + fog; break;
        case 'drizzle': contents = baseCloud + drizzle; break;
        case 'freezing-drizzle': contents = baseCloud + drizzle + ice; break;
        case 'rain': contents = baseCloud + rain; break;
        case 'freezing-rain': contents = baseCloud + rain + ice; break;
        case 'snow': contents = baseCloud + snow; break;
        case 'snow-grains': contents = baseCloud + ice; break;
        case 'showers': contents = sky + baseCloud + rain; break;
        case 'snow-showers': contents = sky + baseCloud + snow; break;
        case 'thunderstorm': contents = baseCloud + rain + bolt; break;
        case 'hail-storm': contents = baseCloud + bolt + hail; break;
        default: contents = sky + baseCloud;
      }
      return `<svg class="weather-svg weather-${type}" viewBox="0 0 100 100" aria-hidden="true" focusable="false">${contents}</svg>`;
    }

    // Alt şerit hava kartı
    function renderWeather(data) {
      const c = data.current;
      if (!c) return;
      const condition = weatherLabel(Number(c.weather_code));
      const isDay = (c.is_day === 0 || c.is_day === 1)
        ? Number(c.is_day) === 1
        : (nowMin() >= 360 && nowMin() < 1140);
      $('weatherIcon').innerHTML = weatherIconSvg(condition.type, isDay);
      setText($('weatherTemp'), Math.round(c.temperature_2m) + '°C');
      setText($('weatherCondition'), tr(condition.key));
      const d = data.daily || {};
      const max = d.temperature_2m_max && d.temperature_2m_max[0];
      const min = d.temperature_2m_min && d.temperature_2m_min[0];
      const rain = d.precipitation_probability_max && d.precipitation_probability_max[0];
      const parts = [tr('feelsLike') + ' ' + Math.round(c.apparent_temperature) + '°'];
      if (finite(max) && finite(min)) parts.push(Math.round(min) + '° / ' + Math.round(max) + '°');
      if (finite(rain)) parts.push('💧 ' + Math.round(rain) + '%');
      setText($('weatherExtra'), parts.join(' · '));
    }

    // 3 günlük tahmin slaytı
    function renderForecast() {
      const d = latestWeatherPayload && latestWeatherPayload.daily;
      const daysEl = $('forecastDays');
      if (!d || !Array.isArray(d.time) || !daysEl) return;
      daysEl.innerHTML = d.time.slice(0, 3).map((iso, i) => {
        const p = String(iso).split('-').map(Number);
        const dt = new Date(Date.UTC(p[0], p[1] - 1, p[2], 12));
        const name = i === 0 ? 'TODAY' : i === 1 ? 'TOMORROW' : weekdayFmt.format(dt).toUpperCase();
        const cond = weatherLabel(Number(d.weather_code && d.weather_code[i]));
        const hi = d.temperature_2m_max && d.temperature_2m_max[i];
        const lo = d.temperature_2m_min && d.temperature_2m_min[i];
        const rain = d.precipitation_probability_max && d.precipitation_probability_max[i];
        return `
          <article class="day-card${i === 0 ? ' today' : ''}">
            <div class="day-name">${name}</div>
            <div class="day-date">${dayMonthFmt.format(dt)}</div>
            <div class="day-icon">${weatherIconSvg(cond.type, true)}</div>
            <div class="day-temp"><span class="hi">${finite(hi) ? Math.round(hi) + '°' : '--'}</span><span class="lo">${finite(lo) ? Math.round(lo) + '°' : '--'}</span></div>
            <div class="day-cond">${tr(cond.key)}</div>
            ${finite(rain) ? `<div class="day-rain">💧 ${Math.round(rain)}%</div>` : ''}
          </article>`;
      }).join('');
      renderExtras();
    }

    function uvLevel(v) {
      if (v < 3) return { label: 'LOW', note: 'No special protection needed', cls: 'uv-low' };
      if (v < 6) return { label: 'MODERATE', note: 'Sun protection recommended', cls: 'uv-mid' };
      if (v < 8) return { label: 'HIGH', note: 'Sunscreen and hat advised', cls: 'uv-high' };
      if (v < 11) return { label: 'VERY HIGH', note: 'Avoid the midday sun', cls: 'uv-vhigh' };
      return { label: 'EXTREME', note: 'Stay in the shade', cls: 'uv-vhigh' };
    }

    // UV + deniz suyu + gün doğumu/batımı kutuları (veri yoksa o kutu hiç çizilmez)
    function renderExtras() {
      const el = $('forecastExtras');
      const d = latestWeatherPayload && latestWeatherPayload.daily;
      if (!el || !d) return;
      const tiles = [];
      const uv = d.uv_index_max && d.uv_index_max[0];
      if (finite(uv)) {
        const lv = uvLevel(Number(uv));
        tiles.push(`<div class="extra-tile"><div class="extra-icon">☀️</div><div class="extra-body"><div class="extra-label">UV index · today's peak</div><div class="extra-value ${lv.cls}">${Math.round(uv)}<small>${lv.label}</small></div><div class="extra-note">${lv.note}</div></div></div>`);
      }
      if (finite(latestSea)) {
        tiles.push(`<div class="extra-tile"><div class="extra-icon">🌊</div><div class="extra-body"><div class="extra-label">Sea temperature</div><div class="extra-value">${Math.round(latestSea)}°C</div><div class="extra-note">Gulf of Antalya</div></div></div>`);
      }
      const sr = d.sunrise && d.sunrise[0];
      const ss = d.sunset && d.sunset[0];
      if (sr && ss) {
        tiles.push(`<div class="extra-tile"><div class="extra-icon">🌅</div><div class="extra-body"><div class="extra-label">Sunrise / Sunset</div><div class="extra-value">${String(sr).slice(11, 16)}<small>/</small>${String(ss).slice(11, 16)}</div><div class="extra-note">Local time</div></div></div>`);
      }
      el.innerHTML = tiles.join('');
    }

    async function fetchWeather() {
      const params = new URLSearchParams({
        latitude: String(CONFIG.location.latitude), longitude: String(CONFIG.location.longitude),
        current: 'temperature_2m,apparent_temperature,weather_code,is_day',
        daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset',
        timezone: TZ, forecast_days: '3'
      });
      try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?' + params.toString(), { cache: 'no-store' });
        if (!response.ok) throw new Error('Weather HTTP ' + response.status);
        const data = await response.json();
        if (!data.current) throw new Error('Weather data missing');
        latestWeatherPayload = data;
        const d = data.daily || {};
        sunTimes = {
          sunrise: minutesFromIso(d.sunrise && d.sunrise[0]),
          sunset: minutesFromIso(d.sunset && d.sunset[0])
        };
        renderWeather(data);
        renderForecast();
        syncDots();
        applyTheme();
      } catch (error) {
        console.warn('Hava durumu güncellenemedi:', error);
        if ($('weatherTemp').textContent === '--°C') setText($('weatherCondition'), tr('weatherUnavailable'));
      }
    }

    async function fetchSea() {
      const params = new URLSearchParams({
        latitude: String(CONFIG.seaPoint.latitude), longitude: String(CONFIG.seaPoint.longitude),
        hourly: 'sea_surface_temperature', timezone: TZ, forecast_days: '1'
      });
      try {
        const response = await fetch('https://marine-api.open-meteo.com/v1/marine?' + params.toString(), { cache: 'no-store' });
        if (!response.ok) throw new Error('Sea HTTP ' + response.status);
        const data = await response.json();
        const arr = data.hourly && data.hourly.sea_surface_temperature;
        if (!Array.isArray(arr)) throw new Error('Sea data missing');
        const hour = Math.floor(nowMin() / 60);
        let value = arr[hour];
        if (!finite(value)) { // o saat boşsa en yakın dolu değeri kullan
          for (let k = 1; k < 24 && !finite(value); k++) {
            value = arr[hour - k];
            if (!finite(value)) value = arr[hour + k];
          }
        }
        latestSea = finite(value) ? Number(value) : null;
        renderExtras();
      } catch (error) {
        console.warn('Deniz suyu sıcaklığı alınamadı:', error);
      }
    }

    /* =====================================================================
       DÖVİZ
       ===================================================================== */
    function renderRates(data) {
      const rates = data.rates;
      const usdTry = Number(rates && rates.TRY);
      const eur = Number(rates && rates.EUR);
      const gbp = Number(rates && rates.GBP);
      if (!(usdTry > 0 && eur > 0 && gbp > 0)) return;
      setText($('usdRate'), rateFmt.format(usdTry) + ' ₺');
      setText($('eurRate'), rateFmt.format(usdTry / eur) + ' ₺');
      setText($('gbpRate'), rateFmt.format(usdTry / gbp) + ' ₺');
      const updated = data.time_last_update_utc ? new Date(data.time_last_update_utc) : new Date();
      setText($('currencyNote'), tr('rateUpdated') + ' ' + hmFmt.format(updated) + ' · ' + tr('rateNote'));
    }

    async function fetchRates() {
      try {
        const response = await fetch('https://open.er-api.com/v6/latest/USD', { cache: 'no-store' });
        if (!response.ok) throw new Error('Rates HTTP ' + response.status);
        const data = await response.json();
        if (!data.rates) throw new Error('Rates missing');
        renderRates(data);
      } catch (error) {
        console.warn('Döviz kurları güncellenemedi:', error);
        if ($('usdRate').textContent === '--') setText($('currencyNote'), tr('rateUnavailable'));
      }
    }

    /* =====================================================================
       BAŞLAT
       ===================================================================== */
    // logo.gif bulunamazsa sahte logo çizilmez; yalnızca logo.gif kullanılır.
    $('hotelLogo').addEventListener('error', () => {
      $('hotelLogo').style.visibility = 'hidden';
      console.warn('logo.gif yüklenemedi. Dosyanın HTML ile aynı klasörde olduğundan emin olun.');
    });

    buildWave();
    buildLangDots();
    buildTicker();
    buildSlides();
    refreshImages();
    applyLanguage();
    tick();
    fetchWeather();
    fetchSea();
    fetchRates();

    scheduleNextSlide();
    window.setInterval(rotateHeaderLanguage, CONFIG.languageDurationMs);
    window.setInterval(fetchWeather, CONFIG.weatherRefreshMs);
    window.setInterval(fetchSea, CONFIG.seaRefreshMs);
    window.setInterval(fetchRates, CONFIG.currencyRefreshMs);

    // TV tarayıcısında sekme geri plana dönerse saat, tema ve verileri yenile
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        tick();
        fetchWeather();
        fetchSea();
        fetchRates();
      }
    });
  })();
  </script>
</body>
</html>
